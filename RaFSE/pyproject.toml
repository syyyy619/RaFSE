[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rafse"
version = "0.1.0"
description = "Official implementation of RaFSE for University-1652 retrieval."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.13,<2",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
faiss = ["faiss-cpu==1.13.0"]
test = ["pytest>=8,<9"]

[project.scripts]
rafse = "rafse_repro.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
